<!DOCTYPE html>
<html>
<head>
  <script>
    // Single-page app redirect for GitHub Pages
    // When GitHub serves 404, this script runs, decodes the path from the URL,
    // and redirects to index.html with the path as a query param.
    var path = window.location.pathname + window.location.search + window.location.hash;
    var redirect = '/?_redirect=' + encodeURIComponent(path);
    window.location.replace(redirect);
  </script>
</head>
</html>
